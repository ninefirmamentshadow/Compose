name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: drafts-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode keystore
        id: keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.keystore.outputs.present == 'true'
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: drafts-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish current APK release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/drafts-release"
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/drafts-release/Drafts-current-debug.apk"

          assets=("$RUNNER_TEMP/drafts-release/Drafts-current-debug.apk")
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/drafts-release/Drafts-current.apk"
            assets+=("$RUNNER_TEMP/drafts-release/Drafts-current.apk")
          fi

          gh release delete compose-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create compose-latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Drafts / Compose — Current" \
            --notes "Current public build. Use Drafts-current.apk when present; otherwise Drafts-current-debug.apk is the installable debug build." \
            "${assets[@]}"

      - name: Remove keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.jks"
